known_limitations:
  - no production runtime backend
  - bounded public workflow registry
  - no enterprise evidence ledger backend
  - offline EvidenceProvider candidates are not automatically promoted into the Trust Gate ledger
  - signed-bundle HMAC is a local integrity demo, not public-key issuer attestation
  - no complete enterprise effect taxonomy
  - migrated replay uses explicit unsigned local-review opt-in; cryptographic signatures are not implemented
  - no production registry service, distributed lock, or registry authorization backend
  - no downstream integration implementation
  - no MCP transport, OAuth, task runtime, elicitation, sampling, multi-round execution, or tool execution
  - MCP descriptions and annotations remain untrusted and a passed assessment is not proof of server/tool safety
  - no v1 final stability claim
