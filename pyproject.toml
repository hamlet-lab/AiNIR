[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ainir-public-demo"
dynamic = ["version"]
description = "AiNIR v1.0 RC candidate public demo: inspecting AI-generated program semantics before lowering or execution."
readme = "README.md"
authors = [{name = "Lee Yoon Kyu"}]
maintainers = [{name = "Lee Yoon Kyu"}]
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "AUTHORS.md"]
dependencies = ["PyYAML>=6"]

[project.scripts]
ainir = "ainir.entrypoint:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ainir = ["registries/*.yaml", "schemas/*.json", "schemas/*.yaml", "profile_packs/*/*.yaml", "profile_packs/*/examples/*/*.yaml", "mcp_profiles/*/*.yaml", "mcp_profiles/*/descriptors/*.json", "demo_examples/*.json", "demo_examples/*/*.yaml"]

[tool.setuptools.dynamic]
version = {attr = "ainir._version.__version__"}

[project.optional-dependencies]
dev = ["jsonschema>=4", "pytest>=8", "setuptools>=68", "wheel>=0.43"]
