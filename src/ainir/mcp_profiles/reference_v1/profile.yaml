profile_id: ainir.mcp.reference.workspace.v1
profile_version: '1.0'
display_name: AiNIR MCP workspace tool-call reference profile
description: Consumer-neutral, host-owned semantic checks for three bounded workspace
  tools. This profile does not execute MCP tools.
status: bundled
protocol_versions:
- '2025-11-25'
- '2026-07-28'
policies:
  unknown_tool: refuse
  tool_descriptions_are_evidence: false
