name: enable-packaged-demo

on:
  push:
    branches:
      - agent/improve-public-onboarding
    paths:
      - scripts/enable_packaged_demo.py
      - .github/workflows/enable-packaged-demo.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.11'
      - name: Apply packaged-demo migration
        run: python scripts/enable_packaged_demo.py
      - name: Smoke-test installed package outside repository
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          cd "$RUNNER_TEMP"
          python -m ainir demo --out-dir "$RUNNER_TEMP/ainir-packaged-demo"
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml src/ainir/cli.py src/ainir/demo_resources.py src/ainir/demo_examples .github/workflows/ci.yml
          if git diff --cached --quiet; then
            echo "No migration changes"
          else
            git commit -m "feat: make public demo available from installed package"
            git push origin HEAD:agent/improve-public-onboarding
          fi
