name: generate-social-preview

on:
  push:
    branches:
      - agent/improve-public-onboarding
    paths:
      - scripts/generate_social_preview.py
      - .github/workflows/generate-social-preview.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.11'
      - name: Install Pillow
        run: python -m pip install pillow
      - name: Generate social preview
        run: python scripts/generate_social_preview.py
      - name: Commit preview asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ainir-social-preview.png
          if git diff --cached --quiet; then
            echo "No asset changes"
          else
            git commit -m "docs: add AiNIR social preview asset"
            git push origin HEAD:agent/improve-public-onboarding
          fi
