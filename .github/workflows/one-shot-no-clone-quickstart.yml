name: one-shot-no-clone-quickstart

on:
  push:
    branches:
      - agent/no-clone-quickstart

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - name: Patch README and packaged-demo smoke
        run: |
          python - <<'PY'
          from pathlib import Path

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          old = '''## Quick start

Run from the repository root. The public demo only needs the package's runtime dependencies; contributor/test tooling is optional.

### macOS / Linux

```bash
python -m venv .venv
source .venv/bin/activate
pip install -e .
python -m ainir demo --out-dir "${TMPDIR:-/tmp}/ainir_demo_results"
```

### Windows PowerShell

```powershell
python -m venv .venv
. .venv\\Scripts\\Activate.ps1
pip install -e .
python -m ainir demo --out-dir "$env:TEMP\\ainir_demo_results"
```

If you plan to run the full test suite or contributor checks, install the development extras with `pip install -e ".[dev]"`.

Then inspect a single Trust Gate decision:

```bash
python -m ainir trust evaluate examples/create_user_outbox_safe/draft.yaml --json --out-dir /tmp/ainir_trust_gate
```

On Windows PowerShell, replace `/tmp/...` with `$env:TEMP\\...`.

Want only the shortest path? Start with [`START_HERE.md`](START_HERE.md).
'''
          new = '''## Quick start

The bundled public demo travels with the installed package, so you do **not** need to manually clone the repository just to try `ainir demo`.

### Fastest try — macOS / Linux

Requires Python 3.10+ and Git.

```bash
python -m venv .venv
source .venv/bin/activate
python -m pip install "git+https://github.com/hamlet-lab/ainir.git"
ainir demo --out-dir "${TMPDIR:-/tmp}/ainir_demo_results"
```

### Fastest try — Windows PowerShell

Requires Python 3.10+ and Git.

```powershell
python -m venv .venv
. .venv\\Scripts\\Activate.ps1
python -m pip install "git+https://github.com/hamlet-lab/ainir.git"
ainir demo --out-dir "$env:TEMP\\ainir_demo_results"
```

The demo runs from the installed package and can be launched outside a source checkout.

If you want to inspect the source examples, run individual Trust Gate decisions, or contribute, clone the repository and install the development extras:

```bash
git clone https://github.com/hamlet-lab/ainir.git
cd ainir
python -m pip install -e ".[dev]"
python -m ainir trust evaluate examples/create_user_outbox_safe/draft.yaml --json --out-dir /tmp/ainir_trust_gate
```

On Windows PowerShell, replace `/tmp/...` with `$env:TEMP\\...`.

Want the guided path? Start with [`START_HERE.md`](START_HERE.md).
'''
          if old not in text:
              raise SystemExit('expected Quick start block not found')
          readme.write_text(text.replace(old, new, 1), encoding='utf-8')

          workflow = Path('.github/workflows/packaged-demo-smoke.yml')
          wtext = workflow.read_text(encoding='utf-8')
          marker = '  github-source-install-demo:\n'
          if marker not in wtext:
              wtext += '''\n  github-source-install-demo:\n    name: github-source-install-demo\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405\n        with:\n          python-version: '3.11'\n      - name: Install current revision directly from GitHub\n        env:\n          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}\n        run: |\n          REF="$PR_HEAD_SHA"\n          if [ -z "$REF" ]; then REF="$GITHUB_SHA"; fi\n          python -m pip install --upgrade pip\n          python -m pip install "git+https://github.com/${GITHUB_REPOSITORY}.git@${REF}"\n      - name: Run installed demo outside any checkout\n        run: |\n          cd "$RUNNER_TEMP"\n          python -m ainir demo --out-dir "$RUNNER_TEMP/ainir-github-install-demo"\n          ainir demo --out-dir "$RUNNER_TEMP/ainir-github-install-demo-console-script"\n'''
              workflow.write_text(wtext, encoding='utf-8')
          PY
      - name: Commit migration result
        run: |
          if git diff --quiet; then
            echo "No migration changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/workflows/packaged-demo-smoke.yml
          git commit -m "Document and verify no-clone quick start"
          git push

