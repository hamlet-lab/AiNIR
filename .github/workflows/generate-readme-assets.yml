name: generate-readme-assets

on:
  push:
    branches:
      - agent/improve-public-onboarding
    paths:
      - scripts/generate_readme_gifs.py
      - .github/workflows/generate-readme-assets.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: agent/improve-public-onboarding
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.11'

      - name: Install Pillow
        run: python -m pip install Pillow==11.3.0

      - name: Generate GIF assets
        run: python scripts/generate_readme_gifs.py

      - name: Commit generated assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ainir-readme-short-demo.gif assets/ainir-refused-vs-passed.gif
          if git diff --cached --quiet; then
            echo "No generated asset changes."
            exit 0
          fi
          git commit -m "docs: add animated README demos"
          git push origin HEAD:agent/improve-public-onboarding
