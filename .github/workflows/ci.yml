name: public-demo-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: full-tests-py3.11
    runs-on: ubuntu-latest
    steps:
      # Pinned to actions/checkout v5 release tag commit 93cb6efe18208431cddfb8368fd83d5badbf9bfd.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      # Pinned to actions/setup-python v6 release tag commit a309ff8b426b58ec0e2a45f0f869d46889d02405.
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.lock.txt
      # Pinned to actions/setup-node v5 release tag commit a0853c24544627f65ddf259abe73b1d18a591444.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
      - name: Install Node dependencies from package-lock
        run: |
          npm ci
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Install package and test dependencies with locked constraints
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c requirements.lock.txt -e ".[dev]"

      - name: Run full Python test suite
        run: python -m pytest -q -p no:cacheprovider

      - name: Validate bundled workflow profile and unified conformance pack
        run: |
          python -m ainir profile validate ainir.public-demo.v1
          python -m ainir conformance run ainir.public-demo.v1 --out-dir "$RUNNER_TEMP/ainir-profile-conformance"

      - name: Validate registry evolution artifacts and replay-mode contracts
        run: |
          python -m ainir registry snapshot --evolution --out "$RUNNER_TEMP/ainir-registry-snapshot.json" --json
          python -m ainir registry diff "$RUNNER_TEMP/ainir-registry-snapshot.json" "$RUNNER_TEMP/ainir-registry-snapshot.json" --json
          python -m pytest -q -p no:cacheprovider tests/test_p4_registry_evolution_and_replay.py

      - name: Validate offline EvidenceProvider contracts and no-auto-promotion boundary
        run: |
          python scripts/check_offline_evidence_providers.py --out-dir "$RUNNER_TEMP/ainir-offline-evidence"
          python -m pytest -q -p no:cacheprovider tests/test_p5_offline_evidence_providers.py

      - name: Validate bounded non-executing MCP tool-call preflight
        run: |
          python scripts/check_mcp_tool_call_profile.py --out-dir "$RUNNER_TEMP/ainir-mcp-tool-call-profile"
          python -m ainir mcp profile
          python -m ainir mcp conformance --out-dir "$RUNNER_TEMP/ainir-mcp-conformance"
          python -m pytest -q -p no:cacheprovider tests/test_p6_mcp_tool_call_profile.py

      - name: Validate external MCP authoring and OpenAI function-call host preflight
        run: |
          python scripts/check_openai_function_tool_adapter.py --out-dir "$RUNNER_TEMP/ainir-openai-function-tool"
          python -m ainir openai function-tool assess examples/openai_function_tool/tool_definition.json examples/openai_function_tool/function_call.json examples/openai_function_tool/host_binding.json examples/openai_function_tool/host_input.json --out-dir "$RUNNER_TEMP/ainir-openai-preflight" --json
          python -m pytest -q -p no:cacheprovider tests/test_p7_openai_host_adapter_and_mcp_authoring.py

      - name: Phase 30 v1.0 RC candidate quick integrity check
        run: python scripts/run_phase30_v1_rc_candidate_check.py --mode quick-integrity

  python-compat:
    name: python-${{ matrix.python-version }}-public-contracts
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: requirements.lock.txt
      - name: Install package and test dependencies with locked constraints
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c requirements.lock.txt -e ".[dev]"
      - name: Run version, resource, registry, and Trust Gate compatibility checks
        run: |
          python -m pytest -q -p no:cacheprovider -m "not distribution" tests/test_release_identity_and_resources.py tests/test_phase1_registry.py tests/test_phase18_trust_gate.py tests/test_p4_registry_evolution_and_replay.py tests/test_p5_offline_evidence_providers.py tests/test_p6_mcp_tool_call_profile.py tests/test_p7_openai_host_adapter_and_mcp_authoring.py
          python -m ainir --help
          python -m ainir profile validate ainir.public-demo.v1
          python -m ainir mcp profile
          python -m ainir mcp conformance --out-dir "$RUNNER_TEMP/ainir-mcp-conformance"
          python scripts/check_openai_function_tool_adapter.py --out-dir "$RUNNER_TEMP/ainir-openai-function-tool"
          python -m ainir registry snapshot --evolution --out "$RUNNER_TEMP/ainir-registry-snapshot.json" --json
          python -m ainir registry diff "$RUNNER_TEMP/ainir-registry-snapshot.json" "$RUNNER_TEMP/ainir-registry-snapshot.json" --json

  platform-smoke:
    name: ${{ matrix.os }}-distribution-smoke
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.lock.txt
      - name: Install package and distribution tooling with locked constraints
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c requirements.lock.txt -e ".[dev]"
      - name: Build and verify wheel and source-distribution contracts
        run: python scripts/check_distribution_contracts.py
