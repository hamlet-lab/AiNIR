name: verify-pypi

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify-public-pypi-install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.11'
      - name: Install current public AiNIR release from PyPI and run demo
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir --index-url https://pypi.org/simple ainir==1.0.0rc2
          cd "$RUNNER_TEMP"
          python -c "from importlib.metadata import version; assert version('ainir') == '1.0.0rc2'"
          python -m ainir demo --out-dir "$RUNNER_TEMP/ainir-pypi-demo-module"
          ainir demo --out-dir "$RUNNER_TEMP/ainir-pypi-demo-script"
