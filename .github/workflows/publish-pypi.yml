name: publish-pypi

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Build only, publish to TestPyPI, or publish to PyPI"
        required: true
        default: build-only
        type: choice
        options:
          - build-only
          - testpypi
          - pypi

permissions:
  contents: read

jobs:
  build:
    name: build-and-verify-distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.11'
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
      - name: Run distribution contract check
        run: |
          python scripts/check_distribution_contracts.py \
            --work-dir "$RUNNER_TEMP/ainir-release-contract" \
            --output "$RUNNER_TEMP/ainir-release-contract-report.json"
      - name: Build wheel and sdist
        run: python -m build --sdist --wheel --outdir dist
      - name: Verify built package identity
        run: |
          python - <<'PY'
          from email.parser import BytesParser
          from pathlib import Path
          from runpy import run_path
          from zipfile import ZipFile

          source_version = run_path('src/ainir/_version.py')['__version__']
          wheels = sorted(Path('dist').glob('*.whl'))
          sdists = sorted(Path('dist').glob('*.tar.gz'))
          assert len(wheels) == 1, wheels
          assert len(sdists) == 1, sdists
          with ZipFile(wheels[0]) as zf:
              metadata_name = next(name for name in zf.namelist() if name.endswith('.dist-info/METADATA'))
              metadata = BytesParser().parsebytes(zf.read(metadata_name))
          assert metadata['Name'] == 'ainir', metadata['Name']
          assert metadata['Version'] == source_version, (metadata['Version'], source_version)
          print(f"verified {metadata['Name']} {metadata['Version']}")
          PY
      - name: Install wheel into a fresh environment and run demo outside checkout
        run: |
          python -m venv "$RUNNER_TEMP/ainir-release-venv"
          "$RUNNER_TEMP/ainir-release-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/ainir-release-venv/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/ainir-release-venv/bin/python" -m ainir demo --out-dir "$RUNNER_TEMP/ainir-release-demo-module"
          "$RUNNER_TEMP/ainir-release-venv/bin/ainir" demo --out-dir "$RUNNER_TEMP/ainir-release-demo-script"
      - name: Upload verified distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish-testpypi:
    name: publish-to-testpypi
    if: ${{ inputs.target == 'testpypi' }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/ainir
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish package distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: publish-to-pypi
    if: ${{ inputs.target == 'pypi' }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ainir
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
